services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: iranapi-backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=IranAPIBackend.settings

  frontend:
    build:
      context: ./api-hub-express
    container_name: iranapi-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000/api
    depends_on:
      - backend


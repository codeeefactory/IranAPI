map $request_uri $iranapi_content_security_policy {
    # sha256 must match the inline metadata script in api-hub-express/index.html
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'";
    ~^/admin/ "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/wasm;

    # Applied when TLS termination is enabled for this server. Legacy TLS is
    # deliberately excluded; production edge/CDN must match this baseline.
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($request_method ~ ^(TRACE|TRACK)$) {
        return 405;
    }

    add_header Content-Security-Policy $iranapi_content_security_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Django emits the same headers when reached directly. Keep a single
    # edge-controlled copy on proxied responses to avoid duplicate policies.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cross-Origin-Opener-Policy;

    # Django admin/vendor assets are served by the backend container. The SPA is
    # built with base "/" so its Vite assets live at /assets/* on the local
    # filesystem and never collide with Django's /static/ namespace.
    location ~ ^/static/(?:admin|vendor|jazzmin|api)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Proxy only Django API namespaces. Public catalog pages use /api/<slug>
    # and must keep falling through to the SPA entrypoint below.
    location ~ ^/api/(?:v1|health|auth|profile|caller|studio|projects|usage|categories|apis|pricing-plans|documentations)(?:/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
